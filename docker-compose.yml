name: ${COMPOSE_PROJECT_NAME:-moxieben}
services:
  app:
    build: .
    image: ${APP_IMAGE:-moxieben:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 330s
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_HOST: ${APP_HOST:?Set APP_HOST}
      DATA_DIR: /var/lib/moxieben
      SECRET_KEY_FILE: /run/secrets/session_key
      PADDLE_OCR_TOKEN_FILE: /run/secrets/paddle_token
      PADDLE_RESULT_HOSTS: ${PADDLE_RESULT_HOSTS:?Set exact trusted result hosts}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-0}
      VLM_REVIEW_BASE_URL: ${VLM_REVIEW_BASE_URL:-}
      VLM_REVIEW_MODEL: ${VLM_REVIEW_MODEL:-}
      VLM_REVIEW_API_KEY_FILE: /run/secrets/visual_key
      VLM_REVIEW_AUTO: ${VLM_REVIEW_AUTO:-0}
    secrets: [session_key, paddle_token, visual_key]
    volumes:
      - type: bind
        source: ${DATA_PATH:?Set absolute DATA_PATH}
        target: /var/lib/moxieben
        bind:
          create_host_path: false
    networks: [backend]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=256m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-127.0.0.1}:80:80'
      - '${HTTPS_BIND:-127.0.0.1}:443:443'
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      app:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
secrets:
  session_key:
    file: ${SECRETS_PATH:?Set absolute SECRETS_PATH}/session_key
  paddle_token:
    file: ${SECRETS_PATH:?Set absolute SECRETS_PATH}/paddle_token
  visual_key:
    file: ${SECRETS_PATH:?Set absolute SECRETS_PATH}/visual_key
networks:
  backend:
volumes:
  caddy_data:
  caddy_config:
